<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14305f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Initial page loader -->
    <style>
      html {
        overflow-x: hidden;
        overflow-y: scroll;
      }

      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f8fc;
        transform: translateY(0);
        opacity: 1;
        transition:
          transform 0.72s cubic-bezier(0.76, 0, 0.24, 1),
          opacity 0.72s ease;
      }

      #page-loader.is-leaving {
        transform: translateY(-100%);
        opacity: 0;
        pointer-events: none;
      }

      #page-loader .loader-bars {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 32px;
      }

      #page-loader .loader-bar {
        width: 4px;
        height: 25%;
        border-radius: 999px;
        background: #3b82f6;
        animation: bar-pulse 1s ease-in-out infinite;
      }

      #page-loader .loader-bar:nth-child(1) {
        animation-delay: 0s;
      }

      #page-loader .loader-bar:nth-child(2) {
        animation-delay: 0.12s;
      }

      #page-loader .loader-bar:nth-child(3) {
        animation-delay: 0.24s;
      }

      #page-loader .loader-bar:nth-child(4) {
        animation-delay: 0.36s;
      }

      #page-loader .loader-bar:nth-child(5) {
        animation-delay: 0.48s;
      }

      @keyframes bar-pulse {
        0%,
        100% {
          height: 25%;
        }

        50% {
          height: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #page-loader .loader-bar {
          animation: none;
          height: 65%;
        }

        #page-loader {
          transition: opacity 0.2s ease;
        }
      }
    </style>

    <!--app-head-->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "THIJAR",
        "legalName": "THIJAR PVT LTD",
        "url": "https://thijar.com",
        "logo": "https://thijar.com/apple-touch-icon.png",
        "description": "Accounting, tax, audit, business advisory and ERP software for growing businesses across India and the GCC.",
        "areaServed": [
          "India",
          "Saudi Arabia",
          "United Arab Emirates",
          "Bahrain",
          "Oman"
        ]
      }
    </script>
  </head>

  <body>
    <!-- Visible immediately, even before React starts -->
    <div id="page-loader" aria-hidden="true">
      <div class="loader-bars">
        <span class="loader-bar"></span>
        <span class="loader-bar"></span>
        <span class="loader-bar"></span>
        <span class="loader-bar"></span>
        <span class="loader-bar"></span>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
